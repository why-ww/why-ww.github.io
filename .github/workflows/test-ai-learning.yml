name: Test learning progress
on:
  workflow_dispatch:
  push:
    paths:
      - '_data/ai_learning.yml'
      - '_includes/ai-*.html'
      - '_layouts/ai-*.html'
      - 'lab/**'
      - 'tests/verify_ai_learning.py'
      - '.github/workflows/test-ai-learning.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install PyYAML beautifulsoup4
      - run: python tests/verify_ai_learning.py
