name: Sync official AI textbooks
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-ai-textbooks.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download official Chinese PDFs and licenses
        run: |
          python - <<'PY'
          import urllib.request, pathlib, json
          books = [
            ("agent", "https://github.com/bojieli/ai-agent-book/releases/download/latest/AI-Agents-in-Depth-zh-CN.pdf", "https://raw.githubusercontent.com/bojieli/ai-agent-book/main/LICENSE"),
            ("infra", "https://github.com/bojieli/ai-infra-book/releases/latest/download/AI-Infra-Book.pdf", "https://raw.githubusercontent.com/bojieli/ai-infra-book/main/LICENSE"),
          ]
          target = pathlib.Path("assets/books")
          target.mkdir(parents=True, exist_ok=True)
          manifest = []
          for slug, url, license_url in books:
              request = urllib.request.Request(url, headers={"User-Agent": "AI-Learning-Lab"})
              with urllib.request.urlopen(request, timeout=120) as response:
                  data = response.read(90 * 1024 * 1024 + 1)
              assert data.startswith(b"%PDF-"), "Not a PDF: " + slug
              assert len(data) <= 90 * 1024 * 1024, "PDF exceeds repository size limit"
              (target / (slug + ".pdf")).write_bytes(data)
              with urllib.request.urlopen(license_url, timeout=30) as response:
                  license_data = response.read()
              (target / ("LICENSE-" + slug + ".txt")).write_bytes(license_data)
              manifest.append({"id": slug, "source": url, "bytes":len(data)})
              print("PDF", slug, len(data))
          (target / "sources.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Save PDFs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/books
          if ! git diff --cached --quiet; then
            git commit -m "Sync official Chinese AI textbook PDFs and source licenses"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
