name: Verify local PDF reader
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/js/ai-pdf-reader.js'
      - 'assets/css/ai-pdf-reader.css'
      - '_includes/ai-pdf-reader.html'
      - 'lab/read/**'
      - 'tests/verify_local_pdf_reader.py'
      - '.github/workflows/test-local-pdf-reader.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Wait for reader deployment
        run: |
          python - <<'PY'
          import urllib.request,time
          for _ in range(24):
              try:
                  with urllib.request.urlopen("https://why-ww.github.io/lab/read/agent/?check="+str(time.time()),timeout=20) as r:
                      html=r.read().decode()
                  if 'data-reader-version="autosave-v2"' in html: break
              except Exception: pass
              time.sleep(10)
          else: raise AssertionError("Reader deployment did not arrive")
          PY
      - run: python tests/verify_local_pdf_reader.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-pdf-reader-preview
          path: local-reader-*.png
          retention-days: 3
