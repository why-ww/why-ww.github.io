name: Verify published AI lab
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-ai-lab.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify overview and relocated learning route
        run: |
          python - <<'PY'
          import json, time, urllib.request
          from playwright.sync_api import sync_playwright
          base = "https://why-ww.github.io"
          for attempt in range(20):
              try:
                  with urllib.request.urlopen(base+"/lab/?verify="+str(time.time()),timeout=15) as r:
                      home=r.read().decode()
                  with urllib.request.urlopen(base+"/lab/roadmap/?verify="+str(time.time()),timeout=15) as r:
                      route=r.read().decode()
                  if 'overview-reference-v4' in home and 'route-reference-v4' in route and 'Shared gold palette v6' in home and 'data-header-version="shared-v5"' in route:
                      break
              except Exception as error:
                  print("WAIT",str(error))
              time.sleep(10)
          else:
              raise AssertionError("Updated pages not yet published")
          with sync_playwright() as p:
              browser=p.chromium.launch()
              page=browser.new_page(viewport={"width":1672,"height":941})
              errors=[]
              header_signatures={}
              page.on("pageerror",lambda error: errors.append(str(error)))
              for name,path in (("overview","/lab/"),("roadmap","/lab/roadmap/")):
                  page.set_viewport_size({"width":1672,"height":941})
                  page.goto(base+path+"?ui=v4-"+str(time.time()),wait_until="networkidle")
                  assert page.locator(".ai-site-nav").evaluate("(el)=>getComputedStyle(el).display")=="flex"
                  gold = page.locator(".ai-site-nav a[aria-current]").evaluate("(el)=>getComputedStyle(el).color")
                  assert gold == "rgb(211, 182, 119)", gold
                  print("GOLD",name,gold)
                  if name=="overview":
                      assert page.locator(".ov-next").evaluate("(el)=>getComputedStyle(el).color") == gold
                      assert page.locator(".ov-project-count").evaluate("(el)=>getComputedStyle(el).color") == gold
                      assert page.locator(".ov-course").count()==3
                      assert page.locator(".ov-project").count()==2
                      assert page.locator(".ov-project-count").inner_text().strip()=="0 / 5"
                      assert page.locator(".ov-progress-row > strong").inner_text()=="0%"
                      assert "monospace" in page.locator(".ov-project-count").evaluate("(el)=>getComputedStyle(el).fontFamily")
                      assert page.locator(".ov-status > div").count()==4
                      cards=page.locator(".ov-course").evaluate_all("(els)=>els.map(el=>el.getBoundingClientRect().toJSON())")
                      print("HOME_GEOMETRY",json.dumps(cards))
                      assert max(b["y"] for b in cards)-min(b["y"] for b in cards)<2
                      page.locator('.ai-site-nav a').filter(has_text="学习路线").click()
                      assert "/lab/roadmap/" in page.url
                      assert page.locator(".reference-board").count()==1
                      page.locator(".ref-back").click()
                      assert page.locator(".ov-board").count()==1
                  else:
                      assert page.locator(".ref-next h2").evaluate("(el)=>getComputedStyle(el).color") == gold
                      assert page.locator(".ref-chart-titles").evaluate("(el)=>getComputedStyle(el).fill") == gold
                      assert page.locator(".ref-panel").count()==4
                      assert page.locator(".ref-track-unit").count()==20
                      assert page.locator(".ref-experiment").count()==5
                      assert page.locator("#agent").count()==1
                      assert page.locator("#cs146s").count()==1
                      assert page.locator("#infra").count()==1
                      page.locator(".ref-primary").click()
                      page.wait_for_function("document.getElementById('experiment-1').open")
                      page.locator("#experiment-1").evaluate("(el)=>el.open=false")
                      page.locator(".ref-search input").fill("Memory")
                      assert page.locator(".ref-track-unit:visible").count()==1
                      page.locator(".ref-search input").fill("")
                  for width in (1672,1440,1024,768,390):
                      page.set_viewport_size({"width":width,"height":941})
                      page.wait_for_timeout(200)
                      dimensions=page.evaluate("({width:innerWidth,scroll:document.documentElement.scrollWidth})")
                      print("RENDER",name,json.dumps(dimensions))
                      signature=page.evaluate("""() => ({height:document.querySelector('.ai-site-header').getBoundingClientRect().height,brand:getComputedStyle(document.querySelector('.ai-brand')).fontSize,labels:[...document.querySelectorAll('.ai-site-nav a')].map(x=>x.textContent),input:getComputedStyle(document.querySelector('.ref-search input')).height})""")
                      if width in header_signatures:
                          assert header_signatures[width]==signature,"Headers differ"
                      else:
                          header_signatures[width]=signature
                      assert dimensions["scroll"]<=width+1,"Horizontal overflow"
                      if width in (1672,390):
                          page.evaluate("window.scrollTo(0,0)")
                          page.screenshot(path=name+"-"+str(width)+".png",full_page=True)
                  print("PASS",name)
              assert not errors,str(errors)
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-lab-screenshots
          path: '*.png'
          retention-days: 3
