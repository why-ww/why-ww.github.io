name: Verify published AI lab
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-ai-lab.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify dashboard and roadmap on desktop and mobile
        run: |
          python - <<'PY'
          import json, time, urllib.request
          from playwright.sync_api import sync_playwright
          base = "https://why-ww.github.io"
          for attempt in range(18):
              try:
                  with urllib.request.urlopen(base + "/lab/?version=v2-" + str(time.time()), timeout=15) as response:
                      html = response.read().decode()
                  if 'data-ui-version="dashboard-v2"' in html and 'Dashboard v2' in html:
                      break
              except Exception as error:
                  print("WAIT", str(error))
              time.sleep(10)
          else:
              raise AssertionError("New dashboard deployment has not reached Pages")
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              errors = []
              page.on("pageerror", lambda error: errors.append(str(error)))
              for name, path in (("overview","/lab/"), ("roadmap","/lab/roadmap/")):
                  page.goto(base + path + "?ui=v2-" + str(int(time.time())), wait_until="networkidle")
                  assert page.locator('[data-ui-version$="-v2"]').count() == 1
                  assert page.locator(".ai-site-nav").evaluate("(el) => getComputedStyle(el).display") == "flex"
                  if name == "overview":
                      assert page.locator(".ai-stage").count() == 3
                      assert page.locator(".ai-unit-list a").count() == 12
                  else:
                      assert page.locator(".ai-module").count() == 12
                      page.locator('.ai-directory a[href="#infra-unit-3"]').click()
                      assert page.locator("#infra-unit-3").evaluate("(el) => el.open")
                  for width in (1440, 1024, 768, 390):
                      page.set_viewport_size({"width":width,"height":1000})
                      page.wait_for_timeout(200)
                      dimensions = page.evaluate("""() => ({width:innerWidth,scroll:document.documentElement.scrollWidth,nav:getComputedStyle(document.querySelector('.ai-site-nav')).display})""")
                      print("RENDER", name, json.dumps(dimensions))
                      assert dimensions["scroll"] <= width + 1, "Horizontal page overflow"
                      if width in (1440,390):
                          page.evaluate("window.scrollTo(0,0)")
                          page.screenshot(path=name+"-"+str(width)+".png", full_page=True)
                  print("PASS", name)
              assert not errors, str(errors)
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-lab-screenshots
          path: '*.png'
          retention-days: 3
