# AI 学习路线的内容集中维护在这里。状态只根据真实学习记录更新。
next_task: "阅读《深入理解 AI Agent》第一章，写下 Agent 与普通聊天机器人的区别"
stages:
  - id: agent
    number: "01"
    title: "深入理解 AI Agent"
    status: "准备开始"
    description: "从上下文、记忆、工具调用和规划出发，理解 Agent 的组成与工程实现。"
    topics:
      - 上下文
      - 记忆
      - 工具调用
      - 规划
    source_label: "教材仓库"
    source_url: "https://github.com/bojieli/ai-agent-book"
    modules:
      - title: "认识 Agent"
        description: "区分聊天、工作流与 Agent，理解模型、环境和反馈。"
        output: "用自己的话画出一次 Agent 执行流程"
      - title: "上下文与记忆"
        description: "理解上下文窗口、短期记忆与长期记忆的分工。"
        output: "设计一份对话记忆结构，说明保留与遗忘规则"
      - title: "工具调用与规划"
        description: "理解工具描述、参数、执行结果和循环决策。"
        output: "完成一个带工具调用的最小实验，记录失败情况"
      - title: "整合与复盘"
        description: "把概念连接到已有项目，比较实现方案。"
        output: "写一篇实验复盘，整理一个可继续改进的问题"
  - id: cs146s
    number: "02"
    title: "Stanford CS146S"
    status: "待开始"
    description: "通过课程与练习，学习如何在真实软件开发中与 AI 协作。"
    topics:
      - AI 辅助开发
      - 软件工程
      - 实践项目
    source_label: "课程主页"
    source_url: "https://themodernsoftware.dev/"
    modules:
      - title: "建立协作流程"
        description: "阅读课程要求，明确任务拆解、上下文准备与验收方法。"
        output: "为一个小功能写需求、执行步骤和验收清单"
      - title: "实现与代码阅读"
        description: "在小任务中练习生成、阅读、修改与解释代码。"
        output: "完成一个能独立解释的功能改动"
      - title: "测试与调试"
        description: "观察失败现象，提出假设，再用实验缩小问题。"
        output: "记录一次完整的定位、修复和验证过程"
      - title: "项目交付"
        description: "把实现、验证和文档整理成可复用成果。"
        output: "提交一次包含说明与验证结果的项目更新"
  - id: infra
    number: "03"
    title: "深入理解 AI Infra"
    status: "待开始"
    description: "理解模型训练、推理、计算、存储与系统设计的基础。"
    topics:
      - 计算
      - 存储
      - 推理
      - 训练
    source_label: "教材仓库"
    source_url: "https://github.com/bojieli/ai-infra-book"
    modules:
      - title: "系统全景"
        description: "梳理训练与推理链路，认识计算、存储和通信。"
        output: "画出模型服务的基本组成与数据流"
      - title: "计算与资源"
        description: "理解 GPU、显存、批处理与资源约束。"
        output: "记录本机资源，解释模型运行的主要限制"
      - title: "推理与服务"
        description: "观察延迟、吞吐和资源使用，认识部署取舍。"
        output: "完成一个小型推理实验并记录测量条件"
      - title: "训练与系统取舍"
        description: "认识训练流程与分布式系统的基础问题。"
        output: "整理一份问题清单，连接前面学过的系统概念"

# 主页展示内容：主题为个人学习计划，完成状态按真实学习结果维护。
dashboard:
  chapter: "Chapter 1 · 认识 AI Agent"
  chapter_description: "理解 Agent 的基本组成、决策循环，以及它与普通聊天机器人的区别。"
  subtitle: "从原理到实践，构建可信、可控、可扩展的智能体系统"
  goals:
    - "解释 Agent 与普通聊天机器人的区别"
    - "认识模型、上下文、工具与环境的分工"
    - "描述一次行动、观察与反馈的循环"
    - "把基本概念连接到自己的项目"
  experiments:
    - title: "画出 Agent 的基本组成"
      description: "明确模型、工具、上下文与环境的关系"
      steps: "阅读第一章后，画出 Agent 的组成图，并为每个部分写一句作用说明。"
    - title: "拆解一次 Agent 执行过程"
      description: "按输入、决策、行动、观察整理流程"
      steps: "选一个查资料的小任务，写出每一步的输入、决策、行动与观察结果，圈出需要再次决策的位置。"
    - title: "比较聊天机器人与 Agent"
      description: "用同一个任务比较两种工作方式"
      steps: "让聊天机器人和具备工具的 Agent 处理同一个任务，比较各自能够执行的动作和信息来源。"
    - title: "连接已有项目的设计"
      description: "在自己的项目里寻找对应的组成部分"
      steps: "在 CTF Mentor 或 Aemeth Agent 中，标出模型、上下文、记忆与工具，并记录一个暂时不确定的地方。"
    - title: "整理第一章学习复盘"
      description: "记录理解、实验结果与下一步问题"
      steps: "整理本章的概念图、实验现象、仍未解决的问题，发布一篇带 ai-learning 标签的学习记录。"
  tracks:
    - title: "Agent 智能体"
      id: agent
      units: ["Agent 基础概念与组成", "规划与推理", "Memory 与长期记忆", "Tools 与外部环境交互", "多智能体协作", "安全、对齐与可控性", "评测与调试方法", "从原型到应用"]
    - title: "CS146S · AI 协作开发"
      id: cs146s
      units: ["理解 AI 协作开发流程", "需求与任务拆解", "代码实现与阅读", "测试、调试与验证", "工程协作与代码审查", "实践项目与交付"]
    - title: "Infra 基础设施"
      id: infra
      units: ["算力与硬件基础", "模型训练与通信", "数据与存储系统", "模型服务与工程化", "监控、评估与可观测性", "成本与规模化实践"]
