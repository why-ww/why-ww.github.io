<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}AI 工程学习实验室</title>
  <style>{% include ai-lab-styles.html %}</style>
</head>
<body class="ai-page">
  <header class="ai-site-header">
    <div class="ai-shell ai-header-inner">
      <a class="ai-brand" href="{{ '/lab/' | relative_url }}">AI 工程学习实验室</a>
      <nav class="ai-site-nav" aria-label="AI 学习区导航">
        <a href="{{ '/lab/' | relative_url }}"{% if page.ai_section == 'overview' %} aria-current="page"{% endif %}>学习总览</a>
        <a href="{{ '/lab/roadmap/' | relative_url }}"{% if page.ai_section == 'roadmap' %} aria-current="page"{% endif %}>学习路线</a>
        <a href="{{ '/lab/#learning-log' | relative_url }}">学习记录</a>
        <a href="{{ '/lab/#projects' | relative_url }}">项目实践</a>
      </nav>
      <a class="ai-header-back" href="{{ '/' | relative_url }}">返回博客 ↗</a>
    </div>
  </header>
  <main class="ai-shell ai-content" id="main-content">{{ content }}</main>
  <footer class="ai-shell ai-footer">AI ENGINEERING JOURNEY <span>理解 · 实验 · 复盘</span></footer>
<script>
(function () {
  function revealUnit() {
    if (!location.hash) return;
    var target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (!target) return;
    var detail = target.closest('details');
    if (detail) { detail.open = true; requestAnimationFrame(function () { target.scrollIntoView({block: 'start'}); }); }
  }
  window.addEventListener('hashchange', revealUnit);
  revealUnit();
})();
</script>
</body>
</html>
