---
layout: default
---
<link rel="stylesheet" href="{{ '/assets/css/pikachu.css' | relative_url }}?v={{ site.time | date: '%s' }}">
{% include pikachu-roadmap.html %}
{% assign pikachu_posts = site.posts | where_exp: 'post', "post.tags contains 'pikachu'" %}
<noscript>
  <section class="pika-noscript">
    <h2>Pikachu Writeup</h2>
    <p>开启 JavaScript 可查看完整实验路线。你也可以直接阅读已经发布的文章：</p>
    <ul>{% for post in pikachu_posts %}<li><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></li>{% else %}<li>尚未发布 Pikachu Writeup。</li>{% endfor %}</ul>
  </section>
</noscript>
{% capture json_lt %}\u003c{% endcapture %}
<script type="application/json" id="pikachu-roadmap-data">{{ site.data.pikachu_roadmap | jsonify | replace: '<', json_lt }}</script>
<script type="application/json" id="pikachu-posts">[
{% for post in pikachu_posts %}
  {"module":{{ post.module | jsonify | replace: '<', json_lt }},"completed":{{ post.completed | jsonify }},"challenge":{{ post.challenge | default: post.challenge_name | default: post.lesson | jsonify | replace: '<', json_lt }},"skill":{{ post.pikachu_skill | default: post.skill | jsonify | replace: '<', json_lt }},"title":{{ post.title | jsonify | replace: '<', json_lt }},"url":{{ post.url | relative_url | jsonify | replace: '<', json_lt }},"date":{{ post.date | date: '%Y-%m-%d' | jsonify }}}{% unless forloop.last %},{% endunless %}
{% endfor %}
]</script>
<script src="{{ '/assets/js/pikachu-progress.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
<script src="{{ '/assets/js/pikachu.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
